<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchcraft</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1a1a18;
    --ink-2: #55534d;
    --ink-3: #8b8880;
    --rule: #e4e1d9;
    --mine: #7a3b2e;
    --ai: #2f5d62;
    --ai-soft: #eef4f4;
    --lock: #6b6248;
    --third: #5a4a7a;
    --r: 8px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px; border-bottom: 1px solid var(--rule); background: var(--panel);
  }
  header h1 { font: 600 16px/1 var(--serif); margin: 0; }
  header .tag { color: var(--ink-3); font-size: 12.5px; }
  header .spacer { flex: 1; }

  .wrap {
    display: grid; grid-template-columns: 262px minmax(0,1fr) 310px;
    height: calc(100vh - 47px);
  }
  .pane { overflow-y: auto; padding: 16px 15px; }
  .pane.center { padding: 24px 30px 90px; background: var(--bg); }
  .pane.left, .pane.right { background: var(--panel); }
  .pane.left { border-right: 1px solid var(--rule); }
  .pane.right { border-left: 1px solid var(--rule); }

  h2 { font: 600 20px/1.3 var(--serif); margin: 0 0 4px; }
  h3 {
    font: 600 11.5px/1 inherit; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); margin: 0 0 10px;
  }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  button {
    font: 500 13px inherit; padding: 7px 13px; border-radius: 6px;
    border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer;
  }
  button:hover { opacity: .87; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  button.ai { background: var(--ai); border-color: var(--ai); }
  button.sm { padding: 4px 9px; font-size: 12px; }
  button.link {
    background: none; border: none; color: var(--ai); padding: 0; font-size: 12px;
    text-decoration: underline; cursor: pointer;
  }

  input, textarea, select {
    width: 100%; font: 14px/1.5 inherit; color: var(--ink);
    padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px;
    background: #fff; resize: vertical;
  }
  input:focus, textarea:focus { outline: 2px solid #cdc6b4; outline-offset: -1px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 5px; }
  label .hint { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }

  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r); padding: 19px 21px; margin-bottom: 18px;
  }

  .src {
    padding: 9px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
  }
  .src:hover { background: #f3f1ea; }
  .src.on { background: #edeadf; }
  .src .t { font-weight: 500; font-size: 13.5px; }
  .src .m { font-size: 11.5px; color: var(--ink-3); }

  .locked {
    border-left: 3px solid var(--lock); background: #faf8f1;
    padding: 14px 17px; margin-bottom: 18px; border-radius: 0 var(--r) var(--r) 0;
  }
  .stamp {
    font: 600 10.5px inherit; text-transform: uppercase; letter-spacing: .09em;
    color: var(--lock); margin-bottom: 9px;
  }
  .locked dt { font-weight: 600; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
  .locked dd { margin: 2px 0 0; }
  .conf { font-variant-numeric: tabular-nums; font-weight: 600; }

  .ai-block {
    border-left: 3px solid var(--ai); background: var(--ai-soft);
    padding: 16px 18px; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 16px;
  }
  .who {
    font: 600 10.5px inherit; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ai); margin-bottom: 11px;
  }
  .hyp { border-top: 1px solid #d8e4e4; padding: 13px 0 3px; }
  .hyp:first-of-type { border-top: 0; padding-top: 3px; }
  .hyp .lab { font-weight: 600; font-size: 14.5px; }
  .kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ai);
    border: 1px solid #b9cfd0; border-radius: 20px; padding: 1px 8px; margin-left: 6px;
    vertical-align: 1.5px;
  }
  .ev { font-size: 13.5px; margin: 7px 0 0; padding-left: 0; list-style: none; }
  .ev li { margin: 3px 0; padding-left: 16px; position: relative; }
  .ev li::before { position: absolute; left: 0; font-weight: 700; }
  .ev.pro li::before { content: "+"; color: #2f6b3f; }
  .ev.con li::before { content: "−"; color: #8d3b32; }
  .kill { font-size: 13px; color: var(--ink-2); margin-top: 6px; font-style: italic; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip {
    font-size: 11.5px; background: #f1efe7; border: 1px solid var(--rule);
    border-radius: 20px; padding: 2px 9px;
  }
  .ctx-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 5px; margin-bottom: 5px; }

  .steps { display: flex; margin-bottom: 22px; font-size: 12px; }
  .step { flex: 1; padding: 6px 3px; text-align: center; border-bottom: 2px solid var(--rule);
          color: var(--ink-3); }
  .step.done { border-color: var(--lock); color: var(--lock); font-weight: 600; }
  .step.now { border-color: var(--mine); color: var(--mine); font-weight: 600; }

  .gate {
    text-align: center; padding: 24px; border: 1px dashed var(--rule);
    border-radius: var(--r); color: var(--ink-3); font-size: 13.5px;
  }
  .err { color: #8d3b32; font-size: 13px; margin-top: 9px; }
  .ok { color: #2f6b3f; font-size: 13px; margin-top: 9px; }
  .brief { white-space: pre-wrap; font: 14.5px/1.6 var(--serif); }

  .term { border-top: 1px solid var(--rule); padding: 9px 0; }
  .term:first-of-type { border-top: 0; }
  .term .w { font-weight: 600; font-size: 13.5px; }
  .term .d { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
  .term .src-tag { font-size: 10px; color: var(--ink-3); text-transform: uppercase;
                   letter-spacing: .06em; margin-left: 5px; }

  .rec { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-bottom: 9px; }
  .rec audio { width: 100%; height: 32px; margin: 7px 0; }
  .verbatim {
    font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    background: #f8f7f2; border: 1px solid var(--rule); border-radius: 5px;
    padding: 9px 11px; white-space: pre-wrap; margin-top: 6px;
  }
  .drop {
    border: 1.5px dashed var(--rule); border-radius: var(--r); padding: 18px;
    text-align: center; color: var(--ink-3); font-size: 13px; cursor: pointer;
  }
  .drop.over { border-color: var(--mine); background: #faf4f2; color: var(--mine); }

  .conn { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .third-block {
    border-left: 3px solid var(--third); background: #f4f1f8;
    padding: 14px 16px; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 16px;
  }
  .third-block .who { color: var(--third); }

  dialog { border: 1px solid var(--rule); border-radius: 10px; padding: 24px;
           max-width: 760px; width: 92%; }
  dialog::backdrop { background: rgba(26,26,24,.35); }
  .row { display: flex; gap: 8px; align-items: center; }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tab { font-size: 12px; padding: 5px 10px; border-radius: 20px; cursor: pointer;
         border: 1px solid var(--rule); color: var(--ink-2); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Benchcraft</h1>
  <span class="tag">form your view, then meet the argument</span>
  <span class="spacer"></span>
  <span id="projname" class="tag"></span>
  <button class="ghost sm" id="btn-brief">Brief</button>
  <button class="ghost sm" id="btn-graph">Decision graph</button>
</header>

<div class="wrap">
  <div class="pane left">
    <h3>Sources</h3>
    <div id="srclist"></div>
    <button class="ghost sm" id="btn-new" style="margin-top:10px;width:100%">+ New experiment</button>
  </div>

  <div class="pane center" id="main"></div>

  <div class="pane right">
    <div class="tabs">
      <div class="tab on" data-tab="plain">Plain language</div>
      <div class="tab" data-tab="voice">Voice</div>
      <div class="tab" data-tab="conn">Connected</div>
    </div>
    <div id="rail"></div>
  </div>
</div>

<dialog id="modal"><div id="modal-body"></div>
  <div style="margin-top:16px;text-align:right"><button class="ghost" onclick="modal.close()">Close</button></div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
