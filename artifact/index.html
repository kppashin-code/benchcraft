<title>Benchcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
  /* Three panes: the research log, the open entry, and the reference rail; one at a time on a phone. */
  :root {
    --paper: #f2f6f3;
    --raised: #ffffff;
    --sunk: #e4ede7;
    --hover: #f7faf8;
    --rule: #d3dfd8;
    --rule-2: #b7c7bf;
    --rule-strong: #74899e;
    --ink: #021c45;
    --ink-2: #3f5873;
    --ink-3: #58708a;
    --eucalyptus: #24664f;
    --sage: #d9ebe0;
    --sage-line: #b9d8c6;
    --cobalt: #1a56b8;
    --cobalt-soft: #e6eefb;
    --cobalt-line: #c9daf3;
    --on-cobalt: #ffffff;
    --on-ink: #f2f6f3;
    --sky: #5aa9e6;
    --teal: #1d6f78;
    --amber: #9a5b00;
    --amber-soft: #fbefd9;
    --amber-line: #e6cd9f;
    --rust: #a23b2c;
    --rust-soft: #f7e6e2;
    --focus: #1d6f78;
    --mark: #fbeaa5;
    --liquid: #dcebf8;
    --bg: var(--paper); --panel: var(--raised); --navy: var(--ink);
    --ai: var(--cobalt); --ai-soft: var(--cobalt-soft); --ai-line: var(--cobalt-line); --on-ai: var(--on-cobalt);
    --lock: var(--ink-2); --third: var(--sky); --ok-bg: var(--sage); --ok-ink: var(--eucalyptus);
    --r: 14px; --r-sm: 9px;
    --text: "Newsreader", Charter, "Iowan Old Style", Georgia, serif;
    --serif: var(--text);
    --ui: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    --mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #0a1727;
    --raised: #112237;
    --sunk: #071120;
    --hover: #15283f;
    --rule: #21354d;
    --rule-2: #33506d;
    --rule-strong: #5d7790;
    --ink: #e4edf1;
    --ink-2: #a9bccb;
    --ink-3: #8aa0b3;
    --eucalyptus: #7fcca9;
    --sage: #163a30;
    --sage-line: #25503f;
    --cobalt: #8db8ff;
    --cobalt-soft: #14294a;
    --cobalt-line: #27467a;
    --on-cobalt: #0a1727;
    --on-ink: #0a1727;
    --sky: #6fb8f0;
    --teal: #6cc3c9;
    --amber: #f0b45a;
    --amber-soft: #3a2a10;
    --amber-line: #6b4e1d;
    --rust: #ff8f7d;
    --rust-soft: #3d1c17;
    --focus: #6cc3c9;
    --mark: #5c4d14;
    --liquid: #173556;
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --paper: #0a1727;
    --raised: #112237;
    --sunk: #071120;
    --hover: #15283f;
    --rule: #21354d;
    --rule-2: #33506d;
    --rule-strong: #5d7790;
    --ink: #e4edf1;
    --ink-2: #a9bccb;
    --ink-3: #8aa0b3;
    --eucalyptus: #7fcca9;
    --sage: #163a30;
    --sage-line: #25503f;
    --cobalt: #8db8ff;
    --cobalt-soft: #14294a;
    --cobalt-line: #27467a;
    --on-cobalt: #0a1727;
    --on-ink: #0a1727;
    --sky: #6fb8f0;
    --teal: #6cc3c9;
    --amber: #f0b45a;
    --amber-soft: #3a2a10;
    --amber-line: #6b4e1d;
    --rust: #ff8f7d;
    --rust-soft: #3d1c17;
    --focus: #6cc3c9;
    --mark: #5c4d14;
    --liquid: #173556;
    color-scheme: dark;
  }
  html { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 var(--text);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px; flex: none;
    padding: 12px 18px 10px; background: transparent;
  }
  .brand { display: flex; align-items: center; }
  .brand h1 {
    font: 600 30px/1 var(--text); margin: 0; letter-spacing: -.005em; white-space: nowrap;
  }
  .brand h1 .mark {
    height: 20px; width: auto; vertical-align: baseline; margin-right: 0;
  }
  .now-title {
    flex: 1 1 0; min-width: 0; text-align: center; font: 600 13.5px/1.3 var(--serif);
    color: var(--ink-2); padding: 0 12px;
    white-space: nowrap; overflow: hidden;
  }
  .tools { display: flex; gap: 6px; flex: none; }
  @media (max-width: 1240px) { .now-title { display: none; } }
  .stages { display: flex; align-items: center; gap: 5px; }
  .stage svg { width: 16px; height: 12px; flex: none; }
  .stage {
    display: flex; align-items: center; gap: 8px;
    font: 500 11.5px/1 var(--ui); letter-spacing: .04em; text-transform: uppercase;
    padding: 10px 14px; border-radius: 999px;
    background: var(--sunk); color: var(--ink-2); border: 1px solid transparent;
  }
  .stage .num { opacity: .5; }
  .stage.done { color: var(--ink-2); background: var(--sunk); }
  .stage.now { background: var(--navy); color: var(--on-ink); }
  .stage-arrow { color: var(--ink-3); font-size: 11px; }

  .wrap {
    display: grid; grid-template-columns: 288px minmax(0,1fr) 348px;
    gap: 10px; padding: 0 10px 10px; flex: 1; min-height: 0;
  }
  .pane { overflow-y: auto; background: var(--panel); border-radius: var(--r); }
  .pane.center { padding: 22px 26px 90px; }

  .pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 16px 16px 13px; border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; background: var(--panel); z-index: 2;
  }
  .pane-head h3 { margin: 0; white-space: nowrap; }
  .pane-head button { white-space: nowrap; }
  h3 {
    font-family: var(--ui); font-weight: 600; font-size: 11px; line-height: 1;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-3); margin: 0 0 10px;
  }

  .log-item { padding: 13px 16px; cursor: pointer; }
  .log-item:hover { background: var(--hover); }
  .log-item[draggable="true"] { cursor: grab; }
  .log-item.dragging { opacity: .35; }
  .drop-zone.over {
    background: var(--ai-soft); outline: 2px dashed var(--ai); outline-offset: -3px;
  }
  .log-item.on { background: var(--sunk); }
  .log-item { position: relative; }
  .log-item .t { font-weight: 600; font-size: 13.5px; line-height: 1.35; padding-right: 22px; }
  .trash {
    background: none; border: none; padding: 3px; border-radius: 5px; cursor: pointer;
    color: var(--ink-3); opacity: 0; transition: opacity .12s;
    display: inline-flex; align-items: center;
  }
  .trash svg { width: 13px; height: 13px; }
  .trash:hover { color: var(--rust); background: var(--rust-soft); }
  .log-item:hover .trash, .notes-row:hover .trash, .rec:hover .trash { opacity: 1; }
  .log-item .trash { position: absolute; top: 11px; right: 10px; }
  .notes-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
  .notes-row > div { flex: 1; }
  .log-meta { display: flex; align-items: center; gap: 9px; margin-top: 6px; }
  .badge { font: 600 10px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; }
  .badge.notice { color: var(--ink-3); }
  .badge.commit { color: var(--lock); }
  .badge.challenge { color: var(--ai); }
  .badge.decide { color: var(--ok-ink); }
  .log-meta .date { font: 11px var(--ui); color: var(--ink-3); }
  .drop-zone { margin: 8px 8px 12px; border-radius: 10px; background: var(--hover); }
  .drop-zone:last-child { background: transparent; }
  .folder-head {
    padding: 12px 14px 8px; font: 600 10.5px var(--ui); letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
    display: flex; justify-content: space-between; align-items: center;
  }
  .drop-zone .log-item {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    margin: 0 8px 6px; padding: 11px 13px; border-left: 1px solid var(--rule);
  }
  .drop-zone .log-item:hover { border-color: var(--rule-2); background: var(--raised); }
  .drop-zone .log-item.on { background: var(--sunk); border-color: var(--ink-3); }
  .drop-zone .log-item .trash { top: 9px; right: 8px; }

  h2 { font: 600 25px/1.25 var(--serif); margin: 0 0 6px; letter-spacing: -.01em; }
  .qline { font-size: 14.5px; color: var(--ink-2); }
  .qline b { color: var(--ink); font-weight: 600; }
  .ctx { font: 12.5px var(--mono); color: var(--ink-2); margin-top: 10px; }
  .ctx b { color: var(--ink-3); font-weight: 400; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  .banner svg { width: 16px; height: 16px; flex: none; }
  .spin svg { width: 13px; height: 13px; vertical-align: -2px; }
  .banner {
    display: flex; align-items: center; gap: 9px;
    background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--sage-line);
    border-radius: var(--r); padding: 12px 16px; margin-bottom: 20px;
    font-size: 14px; font-weight: 500;
  }
  .banner.wait { background: var(--sunk); color: var(--ink-2); border-color: var(--rule); }

  button {
    font-family: var(--ui); font-weight: 500; font-size: 13.5px;
    padding: 9px 17px; border-radius: 999px;
    border: 1px solid var(--navy); background: var(--navy); color: var(--on-ink); cursor: pointer;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
  button.ai { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
  button.sm { padding: 6px 13px; font-size: 12.5px; }
  button.link {
    background: none; border: none; color: var(--ink-2); padding: 0; font-size: 12px;
    text-decoration: underline; cursor: pointer;
  }

  input, textarea, select {
    width: 100%; font-family: inherit; font-size: 14.5px; line-height: 1.55; color: var(--ink);
    padding: 11px 13px; border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
    background: var(--raised); resize: vertical;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  button:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  label { display: block; font-family: var(--ui); font-weight: 600; font-size: 13px; margin: 15px 0 5px; }
  label .hint { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }

  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r); padding: 22px 24px; margin-bottom: 16px;
  }
  .commitcard {
    background: var(--panel); border: 1px solid var(--rule-2);
    border-radius: var(--r); padding: 20px 22px; margin-bottom: 20px;
  }
  .commitcard .hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
  .commitcard .hd .l {
    font: 600 11px var(--ui); letter-spacing: .07em; text-transform: uppercase;
  }
  .commitcard .hd .p { font: 11.5px var(--ui); color: var(--ink-3); }
  .commitcard dt {
    font: 600 10.5px var(--ui); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); margin-top: 15px;
  }
  .commitcard dd { margin: 4px 0 0; font-size: 15px; }
  .meter { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .meter .bar { flex: 1; height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .meter .fill { height: 100%; background: var(--navy); }
  .meter .v { font: 600 13px var(--ui); white-space: nowrap; }

  .sect-label {
    font: 600 11.5px var(--ui); letter-spacing: .07em; text-transform: uppercase;
    color: var(--ai); margin: 26px 0 12px;
  }
  .hypo {
    background: var(--ai-soft); border: 1px solid var(--ai-line);
    border-radius: var(--r); padding: 17px 19px; margin-bottom: 13px;
  }
  .hypo .n {
    font: 600 10.5px var(--ui); letter-spacing: .07em; text-transform: uppercase;
    color: var(--ai); margin-bottom: 8px;
  }
  .hypo .body { font-size: 14.5px; }
  .hypo .sub {
    font: 600 10.5px var(--ui); letter-spacing: .06em; text-transform: uppercase;
    color: var(--ai); margin: 14px 0 5px; padding-top: 12px; border-top: 1px solid var(--ai-line);
  }
  .ev { font-size: 13.5px; margin: 6px 0 0; padding-left: 0; list-style: none; }
  .ev li { margin: 3px 0; padding-left: 16px; position: relative; }
  .ev li::before { position: absolute; left: 0; font-weight: 700; }
  .ev.pro li::before { content: "+"; color: var(--ok-ink); }
  .ev.con li::before { content: "\2212"; color: var(--rust); }
  .kill { font-size: 13px; color: var(--ink-2); margin-top: 7px; font-style: italic; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip {
    font: 12.5px var(--ui); background: var(--sunk); border: 1px solid transparent; color: var(--ink);
    border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .chip:hover { border-color: var(--rule-2); }
  .chip.on { background: var(--ai-soft); border-color: var(--ai-line); color: var(--ai); }
  .chip.mini {
    font: 11.5px var(--ui); padding: 3px 11px; border-radius: 999px; cursor: default;
    border-color: var(--rule);
  }
  .ctx-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 5px; margin-bottom: 5px; }

  .ref-intro { padding: 15px 16px; border-bottom: 1px solid var(--rule); }
  .ref-intro .t {
    font-family: inherit; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--ink-3); margin-bottom: 6px;
  }
  .ref-intro .d { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .ref-state {
    padding: 13px 16px; font-size: 12.5px; line-height: 1.5;
    background: var(--ok-bg); color: var(--ok-ink); border-bottom: 1px solid var(--sage-line);
  }
  .ref-state.wait { background: var(--sunk); color: var(--ink-2); border-bottom-color: var(--rule); }
  .ref-body { padding: 15px 16px 60px; }
  .ref-count { font-size: 12.5px; color: var(--ink-2); }

  .def { border-top: 1px solid var(--rule); padding: 11px 0; }
  .def:first-of-type { border-top: 0; }
  .def .w { font-weight: 600; font-size: 13.5px; }
  .def .d { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .def .src-tag {
    font: 9.5px var(--ui); color: var(--ink-3); text-transform: uppercase;
    letter-spacing: .08em; margin-left: 6px;
  }

  #selpop {
    position: absolute; z-index: 50; display: none;
    background: var(--navy); color: var(--on-ink); border-radius: var(--r);
    font-family: inherit; font-weight: 500; font-size: 12.5px;
    box-shadow: 0 3px 12px rgba(2,28,69,.3); overflow: hidden;
  }
  #selpop span { display: inline-block; padding: 7px 12px; cursor: pointer; }
  #selpop span:hover { background: var(--ai); color: var(--on-ai); }
  #selpop span + span { border-left: 1px solid var(--ink-2); }
  mark {
    background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px;
  }
  .hl-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0;
            border-top: 1px solid var(--rule); }
  .hl-row:first-of-type { border-top: 0; }

  .locked {
    border-left: 3px solid var(--lock); background: var(--sunk);
    padding: 15px 18px; margin-bottom: 18px; border-radius: 0 var(--r) var(--r) 0;
  }
  .stamp {
    font: 600 10px var(--ui); text-transform: uppercase; letter-spacing: .07em;
    color: var(--lock); margin-bottom: 9px;
  }
  .conf { font-variant-numeric: tabular-nums; font-weight: 600; }

  .gate {
    text-align: center; padding: 26px; border: 1px dashed var(--rule-2);
    border-radius: var(--r); color: var(--ink-3); font-size: 13.5px;
  }
  .err { color: var(--rust); font-size: 13px; margin-top: 9px; }
  .brief { white-space: pre-wrap; font: 14.5px/1.6 var(--serif); }

  .rec { border: 1px solid var(--rule); border-radius: var(--r); padding: 11px 13px; margin-bottom: 9px; }
  .rec audio { width: 100%; height: 32px; margin: 7px 0; }
  .verbatim {
    font: 13px/1.55 var(--mono); background: var(--paper); border: 1px solid var(--rule);
    border-radius: 5px; padding: 10px 12px; white-space: pre-wrap; margin-top: 6px;
  }
  .drop {
    border: 1.5px dashed var(--rule-2); border-radius: var(--r); padding: 18px;
    text-align: center; color: var(--ink-3); font-size: 13px; cursor: pointer;
  }
  .drop.over { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); }

  .conn { border: 1px solid var(--rule); border-radius: var(--r); padding: 11px 13px; margin-bottom: 8px; }
  .third-block {
    border-left: 3px solid var(--third); background: var(--paper);
    padding: 15px 17px; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 16px;
  }
  .who {
    font: 600 10px var(--ui); text-transform: uppercase; letter-spacing: .07em;
    color: var(--ai); margin-bottom: 10px;
  }
  .third-block .who { color: var(--teal); }
  .ai-block {
    border-left: 3px solid var(--ai); background: var(--ai-soft);
    padding: 16px 18px; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 16px;
  }

  .penpad { margin-bottom: 18px; }
  .penpad canvas {
    width: 100%; height: 340px; display: block; background: #fbfdfb;
    border: 1px solid var(--rule-2); border-radius: var(--r); touch-action: none;
    cursor: crosshair;
  }
  .pentools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .swatch.on { border-color: var(--ink-3); }
  .inknote {
    border: 1px solid var(--rule); border-radius: var(--r); background: #fbfdfb;
    padding: 6px; margin-bottom: 8px; position: relative;
  }
  .inknote svg { width: 100%; height: auto; display: block; }
  .inknote .rm { position: absolute; top: 6px; right: 8px; }

  .step { padding: 3px 0; }
  .step .link { opacity: 0; margin-left: 8px; }
  .step:hover .link { opacity: 1; }
  .stepnote {
    font: 13px var(--text); color: var(--amber); background: var(--amber-soft);
    border-left: 2px solid var(--amber-line); border-radius: 0 5px 5px 0;
    padding: 5px 10px; margin: 4px 0 6px 18px;
  }
  .paper { border-top: 1px solid var(--rule); padding: 11px 0; }
  .paper:first-of-type { border-top: 0; }
  .paper .pt { font-weight: 600; font-size: 13px; line-height: 1.35; cursor: pointer; }
  .paper .pt:hover { color: var(--teal); }
  .paper .pm { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .pill {
    font: 9.5px var(--ui); border-radius: 999px; padding: 2px 8px; margin-right: 4px;
    border: 1px solid var(--rule-2); color: var(--ink-3); text-transform: uppercase;
    letter-spacing: .06em; white-space: nowrap;
  }
  .pill.on { border-color: var(--ai); color: var(--ai); }
  .pill.mine { border-color: var(--navy); color: var(--navy); }

  dialog {
    border: 1px solid var(--rule); border-radius: 16px; padding: 26px;
    max-width: 760px; width: 92%; background: var(--raised); color: var(--ink);
  }
  dialog.wide { max-width: 1080px; }

  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
  .vial {
    border: 1px solid var(--rule); border-radius: 10px; background: var(--panel);
    padding: 12px 13px 11px; cursor: pointer; position: relative; overflow: hidden;
    display: flex; flex-direction: column; min-height: 122px;
  }
  .vial:hover { border-color: var(--ink-3); }
  .vial .fill {
    position: absolute; left: 0; right: 0; bottom: 0; background: var(--liquid); z-index: 0;
  }
  .vial.low .fill { background: var(--amber-soft); }
  .vial.out .fill { background: var(--rust-soft); }
  .vial > * { position: relative; z-index: 1; }
